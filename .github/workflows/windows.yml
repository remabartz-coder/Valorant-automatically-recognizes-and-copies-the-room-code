name: Windows Build And Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps/downloads
          key: native-downloads-${{ hashFiles('scripts/install-deps.ps1') }}
      - name: Install Pinned Dependencies
        shell: pwsh
        env:
          QUEUEPILOT_FFMPEG_URL: ${{ vars.QUEUEPILOT_FFMPEG_URL }}
        run: ./scripts/install-deps.ps1 -FFmpegArchiveUrl $env:QUEUEPILOT_FFMPEG_URL
      - name: Build And Verify
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipDesktopTests
      # Binary artifacts are not uploaded until corresponding-source work is complete.
