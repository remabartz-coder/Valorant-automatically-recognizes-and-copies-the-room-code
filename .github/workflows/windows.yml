name: Windows Build And Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .deps/downloads
            .deps/release-sources
          key: native-downloads-minimal-${{ hashFiles('scripts/install-deps.ps1', 'scripts/fetch-release-materials.ps1', 'scripts/build-ffmpeg.ps1') }}
      - name: Install MSYS2 Build Tools
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          update: true
          install: make nasm
      - name: Install Qt, ONNX and Models
        shell: pwsh
        run: ./scripts/install-deps.ps1 -SkipFFmpeg -SevenZip 'C:/Program Files/7-Zip/7z.exe'
      - name: Fetch Release FFmpeg Source
        shell: pwsh
        run: ./scripts/fetch-release-materials.ps1
      - name: Build Minimal FFmpeg
        shell: pwsh
        run: |
          $msys = '${{ steps.msys2.outputs.msys2-location }}'
          $env:PATH = "$msys/usr/bin;$env:PATH"
          ./scripts/build-ffmpeg.ps1 -SourceArchive .deps/release-sources/ffmpeg/ffmpeg-n8.1.3.tar.gz -Bash "$msys/usr/bin/bash.exe" -Make "$msys/usr/bin/make.exe"
      - name: Build And Verify
        shell: pwsh
        run: ./scripts/verify.ps1 -FFmpegRoot .deps/ffmpeg-minimal -SkipDesktopTests
